server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  h2:
    console:
      enabled: false
