name: Kiro Code Review

on:
  pull_request:
    branches: [main]

jobs:
  kiro-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro headless review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          kiro-cli chat --no-interactive --trust-all-tools --agent code-reviewer \
            "Review the changes in this PR diff." \
            > review-output.md

          # Safety backstop: GitHub PR comments cap at 65536 chars
          head -c 60000 review-output.md > review-output-trimmed.md
          if [ "$(wc -c < review-output.md)" -gt 60000 ]; then
            echo -e "\n\n_(truncated — response exceeded comment size limit)_" >> review-output-trimmed.md
          fi

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review-output-trimmed.md